# =============================================================================
# NanshanNav — Nginx main configuration (nginx:alpine)
# =============================================================================
# Pure reverse proxy — all requests forwarded to Hono backend.
# Server blocks are in /etc/nginx/conf.d/*.conf.
# =============================================================================

# ---- Main -------------------------------------------------------------------
user  nginx;
pid   /var/run/nginx.pid;

worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;

# ---- Events -----------------------------------------------------------------
events {
    multi_accept       on;
    worker_connections  1024;
}

# ---- HTTP -------------------------------------------------------------------
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging — JSON format for Docker log collection
    # -------------------------------------------------------------------------
    log_format  json  escape=json
        '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log  /var/log/nginx/access.log  json;

    # -------------------------------------------------------------------------
    # Basic performance tuning
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip            on;
    gzip_min_length 1000;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # Proxy parameters (shared by all location blocks in conf.d)
    # -------------------------------------------------------------------------
    proxy_set_header  Host                   $host;
    proxy_set_header  X-Real-IP              $remote_addr;
    proxy_set_header  X-Forwarded-For        $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto      $scheme;

    # -------------------------------------------------------------------------
    # Client limits
    # -------------------------------------------------------------------------
    client_max_body_size  20m;
    client_body_timeout   30s;

    # -------------------------------------------------------------------------
    # Site configuration
    # -------------------------------------------------------------------------
    include  /etc/nginx/conf.d/*.conf;
}
