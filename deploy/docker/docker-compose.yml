# Standalone LAN deployment. No domain or authentication provider is required.
services:
  backend:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    image: nanshan-nav:latest
    container_name: nanshan-nav-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
      HOST: 0.0.0.0
      NAV_READ_ONLY: ${NAV_READ_ONLY:-false}
      NAV_PVE_HOSTS_JSON: ${NAV_PVE_HOSTS_JSON:-[]}
      NAV_HEALTH_TARGETS_JSON: ${NAV_HEALTH_TARGETS_JSON:-[]}
      NAV_EMBED_ORIGINS: ${NAV_EMBED_ORIGINS:-}
      PVE_ENCRYPTION_KEY: ${PVE_ENCRYPTION_KEY:-}
    volumes:
      - nanshan-nav-config:/app/server/config
      - nanshan-nav-uploads:/app/uploads
    ports:
      - "${NAV_BIND_ADDRESS:-0.0.0.0}:${NAV_HTTP_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/status', {signal: AbortSignal.timeout(3000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nanshan-nav-config:
    name: nanshan-nav-config
  nanshan-nav-uploads:
    name: nanshan-nav-uploads
