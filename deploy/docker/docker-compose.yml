version: "3.8"

services:
  backend:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    image: nanshan-nav:latest
    container_name: nanshan-nav-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3001}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      NODE_ENV: production
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      PVE_API_TOKEN: ${PVE_API_TOKEN:-}
      PVE_ENCRYPTION_KEY: ${PVE_ENCRYPTION_KEY:-}
    volumes:
      - nanshan-nav-config:/app/server/config
      - nanshan-nav-uploads:/app/uploads
    networks:
      - nanshan-nav
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health-check?url=https://example.com"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: nanshan-nav-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - nanshan-nav
    depends_on:
      backend:
        condition: service_healthy
      authelia:
        condition: service_started

  # -----------------------------------------------------------------------
  # Redis — optional Authelia session store (in-memory is the lightweight default)
  # Uncomment the service below AND the `redis-data` volume, then enable the
  # `session.redis` block in authelia/config/configuration.yml.
  # -----------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: nanshan-nav-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - nanshan-nav

  authelia:
    image: ghcr.io/authelia/authelia:4.38
    container_name: nanshan-nav-authelia
    restart: unless-stopped
    # depends_on:        # uncomment when redis is enabled
    #   - redis
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      AUTHELIA_USER: ${AUTHELIA_USER:-admin}
      AUTHELIA_PASSWORD: ${AUTHELIA_PASSWORD}
    volumes:
      - ../../authelia/config:/config:ro
      - authelia-db:/db
    networks:
      - nanshan-nav

volumes:
  nanshan-nav-config:
    name: nanshan-nav-config
  nanshan-nav-uploads:
    name: nanshan-nav-uploads
  authelia-db:
    name: authelia-db
  # redis-data:          # uncomment when redis is enabled
  #   name: redis-data
networks:
  nanshan-nav:
    name: nanshan-nav
    driver: bridge
