# Authelia 4.38.18. Render quoted placeholders with render-auth-config.mjs.
# Field reference: https://github.com/authelia/authelia/blob/v4.38.18/config.template.yml
server:
  address: 'tcp://:9091/auth'
log:
  level: info
theme: auto
identity_validation:
  reset_password:
    jwt_secret: "${JWT_SECRET}"
authentication_backend:
  password_reset:
    disable: true
  file:
    path: '/config/users.yml'
session:
  name: authelia_session
  secret: "${SESSION_SECRET}"
  expiration: '1 hour'
  inactivity: '5 minutes'
  cookies:
    - domain: "${NAV_DOMAIN}"
      authelia_url: "${AUTHELIA_URL}"
      default_redirection_url: "${NAV_PUBLIC_URL}"
storage:
  encryption_key: "${STORAGE_ENCRYPTION_KEY}"
  local:
    path: '/db/authelia.db'
notifier:
  filesystem:
    filename: '/db/notification.txt'
access_control:
  default_policy: deny
  rules:
    - domain: "${NAV_DOMAIN}"
      resources:
        - '^/admin([/?].*)?$'
        - '^/api/admin([/?].*)?$'
      subject:
        - 'group:admins'
      policy: one_factor
regulation:
  max_retries: 5
  find_time: '2 minutes'
  ban_time: '5 minutes'
